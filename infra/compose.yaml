services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kernels
      POSTGRES_USER: kernels
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kernels -d kernels"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
