[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-kernel-lab"
version = "0.1.0"
description = "Execution-validated Triton data generation and retrieval experiments"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
retrieval = ["psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
baseline = ["torch>=2.5,<3", "transformers>=4.46,<5", "numpy>=1.26", "pandas>=2", "tqdm>=4"]
embedding = ["sentence-transformers==3.4.1"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["kernel_lab*", "training*"]

[tool.setuptools]
py-modules = ["llm"]

[tool.ruff]
target-version = "py310"
line-length = 110
